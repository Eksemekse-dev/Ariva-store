name: 📦 Build Ariva-Store IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26     # ← ZMIANA z macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          echo "::notice::Using $(xcodebuild -version | head -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild -project ArivaStore.xcodeproj \
            -scheme ArivaStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ArivaStore.app Payload/
          zip -qr Ariva-Store.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ariva-Store-IPA
          path: Ariva-Store.ipa
