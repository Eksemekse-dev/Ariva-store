name: ArivaStore
options:
  bundleIdPrefix: dev.eksemekse
  deploymentTarget:
    iOS: "16.0"

targets:
  ArivaStore:
    type: application
    platform: iOS
    sources:
      - ArivaStore
    info:
      path: ArivaStore/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ariva-Store
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eksemekse.arivastore
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

        # 🔑 TO NAPRAWIA LAYOUT
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        GENERATE_INFOPLIST_FILE: "NO"

        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
